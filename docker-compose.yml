version: '3.9'

networks:
  goals-net:
    driver: bridge
  web:
    external: true

volumes:
  pgdata:

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: goals
      POSTGRES_PASSWORD: ${DB_PASSWORD:-goals}
      POSTGRES_DB: goals
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init-sandbox.sql:/docker-entrypoint-initdb.d/init-sandbox.sql:ro
    networks:
      - goals-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goals -d goals"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://goals:${DB_PASSWORD:-goals}@db:5432/goals
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-production}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_EMAIL: ${VAPID_EMAIL:-mailto:admin@example.com}
      TZ: ${TZ:-America/New_York}
      SEED_USERS: ${SEED_USERS:-Alice,Bob,Charlie,Diana,Eve,Frank}
      ADMIN_PIN: ${ADMIN_PIN:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - goals-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  client:
    build: ./client
    depends_on:
      server:
        condition: service_healthy
    networks:
      - goals-net
      - web
    restart: unless-stopped

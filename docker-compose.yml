version: '3.9'

networks:
  goals-net:
    driver: bridge

volumes:
  pgdata:

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: goals
      POSTGRES_PASSWORD: goals
      POSTGRES_DB: goals
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - goals-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goals -d goals"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - goals-net

  client:
    build: ./client
    depends_on:
      - server
    ports:
      - "80:80"
    networks:
      - goals-net

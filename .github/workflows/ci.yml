name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── Unit tests ──────────────────────────────────────────────────────────────

  server-tests:
    name: Server unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  client-tests:
    name: Client tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test

  # ── TypeScript ──────────────────────────────────────────────────────────────

  typecheck-server:
    name: TypeScript check (server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  typecheck-client:
    name: TypeScript check (client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  # ── Lint ────────────────────────────────────────────────────────────────────

  lint-server:
    name: Lint (server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint

  lint-client:
    name: Lint (client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint

  # ── Security ────────────────────────────────────────────────────────────────

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit server
        run: npm ci && npm audit --audit-level=high
        working-directory: server
      - name: Audit client
        run: npm ci && npm audit --audit-level=high
        working-directory: client

  # ── Build ───────────────────────────────────────────────────────────────────

  build-client:
    name: Build (client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  # ── Integration tests ───────────────────────────────────────────────────────

  server-integration:
    name: Server integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: goals
          POSTGRES_PASSWORD: goals
          POSTGRES_DB: goals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://goals:goals@localhost:5432/goals_test
      DATABASE_URL: postgres://goals:goals@localhost:5432/goals_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run test:integration

  # ── Deploy ──────────────────────────────────────────────────────────────────

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    environment: staging
    steps:
      - name: Deploy staging via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ADMIN_PIN: ${{ secrets.ADMIN_PIN }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: ADMIN_PIN
          script: |
            set -euo pipefail
            cd /opt/goals
            # Inject secrets into staging env file (upsert — remove old line then append)
            sed -i '/^ADMIN_PIN=/d' /opt/goals/staging/.env
            echo "ADMIN_PIN=${ADMIN_PIN}" >> /opt/goals/staging/.env
            git fetch origin ${{ github.head_ref }}
            git reset --hard origin/${{ github.head_ref }}
            APP_PORT=3101 docker compose \
              -p goals-staging \
              --env-file /opt/goals/staging/.env \
              -f docker-compose.yml \
              -f docker-compose.staging.yml \
              up -d --build --remove-orphans
            docker image prune -f

  deploy-prod:
    name: Deploy to production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy production via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ADMIN_PIN: ${{ secrets.ADMIN_PIN }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: ADMIN_PIN
          script: |
            set -euo pipefail
            cd /opt/goals
            # Inject secrets into prod env file (upsert — remove old line then append)
            sed -i '/^ADMIN_PIN=/d' /opt/goals/prod/.env
            echo "ADMIN_PIN=${ADMIN_PIN}" >> /opt/goals/prod/.env
            git fetch origin main
            git reset --hard origin/main
            APP_PORT=3100 docker compose \
              -p goals-prod \
              --env-file /opt/goals/prod/.env \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d --build --remove-orphans
            docker image prune -f
